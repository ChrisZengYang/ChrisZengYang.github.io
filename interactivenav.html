<!DOCTYPE html>
<html>
  <head>
    <title>Interactive Nav</title>
    <style>
      body{
        margin: 0;
        padding: 0;
      }

      ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a class="active" href="#">Home</a></li>
        <li><a href="#">Page 2</a></li>
        <li><a href="#">Page 3</a></li>
      </ul>
    </nav>
    <button class="btn">click me</button>
  </body>
</html>

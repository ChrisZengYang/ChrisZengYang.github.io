<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servables - Welcome</title>
    <link rel="stylesheet" href="../styles.css">

    <!-- Mobile Friendly Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <section style="margin: 100px 0;">
            <h1 style="text-align: center; font-size: 3rem; font-weight: 900;">
                Log In
            </h1>

            <div class="container">
                <form action="../dashboard/" onsubmit="return logIn(event);">
                    <div class="input">
                        <img class="input-icon" src="../resources/user-64.png" alt="key icon" style="width: 32px;">
                        <input id="username" placeholder="Username"><br>
                    </div>
                    <div class="input">
                        <img class="input-icon" src="../resources/key-64.png" alt="key icon" style="width: 32px;">
                        <input id="password" type="password" placeholder="Password"><br>
                    </div>
                    <button type="submit">Log In</button>

                    <small>Don't have an account? <a href="../">Sign Up!</a></small>
                </form>
            </div>
        </section>
    </main>

    <script src="../init.js"></script>
    <script>
        function logIn(event) {
            event.preventDefault();
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            
            const accounts = JSON.parse(localStorage.getItem("accounts")) || {};
            
            console.log(accounts);

            // Check if account exists
            if(!accounts[username]) {
                alert("Username not found!");
                return false;
            }
            
            // Check if password matches
            if(accounts[username].password !== password) {
                alert("Invalid password!");
                return false;
            }
            
            // Set current user and redirect
            localStorage.setItem("currentUser", username);
            window.location.href = "../dashboard/";
            return false;
        }
    </script>
</body>
</html>

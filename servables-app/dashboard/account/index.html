<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Servers | Servables</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <main>
        <section>
        <a href="../">Back</a>
            <h1>Account Settings</h1>
            
            <div style="margin-top: 100px; text-align: left; width: 80%; margin-left: auto; margin-right: auto;">
                <h2 id="username-display"></h2>
                
                <div style="margin: 50px 0;">
                    <h3>Email</h3>
                    <p id="email-display"></p>
                </div>
                
                <div style="margin: 50px 0;">
                    <h3>Account Created</h3>
                    <p id="created-display"></p>
                </div>
                
                <div style="display: flex; justify-content: space-around; margin-top: 100px;">
                    <button style="width: 300px; background-color: #5b8fff;" onclick="changePassword();">Change Password</button>
                    <button style="width: 300px; background-color: rgb(202, 0, 0);" onclick="logOut();">Log Out</button>
                </div>
            </div>
        </section>
    </main>
    <script src="../../init.js"></script>
    <script>
        const accounts = JSON.parse(localStorage.getItem("accounts")) || {};
        const currentUser = localStorage.getItem("currentUser");
        
        if(!currentUser || !accounts[currentUser]) {
            window.location.href = "../../log-in/";
        } else {
            const account = accounts[currentUser];
            document.getElementById("username-display").textContent = "Welcome, " + account.username;
            document.getElementById("email-display").textContent = account.email;
            document.getElementById("created-display").textContent = new Date(account.created).toString();
        }
        
        function changePassword() {
            const newPassword = prompt("Enter new password:");
            if(newPassword) {
                accounts[currentUser].password = newPassword;
                localStorage.setItem("accounts", JSON.stringify(accounts));
                alert("Password changed successfully!");
            }
        }
        
        function logOut() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("currentUser");
                window.location.href = "../../";
            }
        }
    </script>
</body>
</html>

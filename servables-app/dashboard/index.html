<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Servables</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <main>
        <section>
            <h1>Glad you're back, <span id="user"></span>!</h1>
        <section>
        <section>
            <ul class="options">
                <li>
                    <a href="./servers/">
                        <div class="imgcontainer">
                            <img src="../resources/servers.png" alt="Servers">
                        </div>
                        <div>
                            <h2>My Servers</h2>
                            <p>Manage your servers.</p>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="./spaces/">
                        <div class="imgcontainer">
                            <div></div>
                            <img src="../resources/cloud.png" alt="Spaces">
                        </div>
                        <div>
                            <h2>Spaces</h2>
                            <p>Organize servers, add collaborators, etc.</p>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="./account/">
                        <div class="imgcontainer">
                            <img class="circle" src="../resources/user-64.png" alt="Account" style="padding: 5px;">
                        </div>
                        <div>
                            <h2>Account</h2>
                            <p>Manage your account.</p>
                        </div>
                    </a>
                </li>
            </ul>
        </section>
    </main>
    <script src="../init.js"></script>
    <script>
        document.getElementById("user").textContent = user;
    </script>
</body>
</html>

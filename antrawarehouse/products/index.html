<!DOCTYPE html>
<html>

<head>
    <title>Antra Warehouse</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../styles.css">

    <!-- Google Font: JetBrains Mono -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=JetBrains%20Mono">

    <!-- Icon -->
    <link rel="icon" href="../favicon.ico">
</head>

<body>
    <!-- Navigation bar -->
    <nav>
        <!-- Used an unordered list to display navigation links; will set styles in CSS -->
        <ul>
            <li class="brand">
                <img src="../resources/antra.png" alt="Antra Logo" style="float: left;">
            </li>
            <li>
                <a href="../">Home</a>
            </li>
            <li>
                <a href="../products/">Products</a>
            </li>
            <li>
                <a href="../media/">Media</a>
            </li>
        </ul>
    </nav>

    <!-- Products section will be dynamically inserted here depending if a specific product is requested -->
    <section class="products">
        <div class="filter" style="margin-top: 50px;">
            <h4 style="display: inline-block; margin-right: 50px;">Filter by:</h4>
            <select class="filter" onchange="window.location.href=`./${this.value !== 'all' ? '?type=' + this.value : ''}`;">
                <option value="all">All Products</option>
                <option value="helmets">Welding Helmets</option>
                <option value="gear">Welding Protective Gear</option>
            </select>
        </div>
        <script>
            function defaultSelect() {
                let type = new URLSearchParams(window.location.search).get('type') || 'all';
                //Set the select value based on URL parameter
                document.querySelector('.products select').value = type;
            };

            defaultSelect();
        </script>
    </section>

    <footer>
        <div id="footer-info" class="horizontal-row">
            <div class="row-item" style="flex-grow: 2;"> <!-- Flex grow gives the logo more space than the other columns -->
                <img src="../resources/antra.png" alt="Antra Logo" style="height: 75px;">
            </div>
            <div class="row-item">
                <h3>Shop</h3>
                <ul>
                    <li><a href="https://antrawarehouse.com/collections/" target="_blank">Welding Helmets</a></li>
                    <li><a href="https://antrawarehouse.com/collections/welding-safety-gear" target="_blank">Welding Protective Gear</a></li>
                    <li><a href="https://antrawarehouse.com/collections/all-projection-screens" target="_blank">Projection Screens</a></li>
                    <li><a href="https://antrawarehouse.com/collections/free-hdtv-related" target="_blank">Antennae</a></li>
                </ul>
            </div>
            <div class="row-item">
                <h3>Important</h3>
                <ul>
                    <li><a href="https://antrawarehouse.com/pages/warranty" target="_blank">Warranty</a></li>
                    <li><a href="https://antrawarehouse.com/pages/support-center" target="_blank">Manual Downloads</a></li>
                    <li><a href="https://antrawarehouse.com/pages/support-center" target="_blank">How-to videos</a></li>
                </ul>
            </div>
            <div class="row-item">
                <h3>Follow Us On:</h3>
                <ul class="icon-list">
                    <li>
                        <a href="https://www.facebook.com/antrawarehouse/" target="_blank"><img src="../resources/Facebook.png" alt="Facebook Logo"></a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/antraproducts/?hl=en" target="_blank"><img src="../resources/Instagram.png" alt="Instagram Logo"></a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com/@antra3505" target="_blank"><img src="../resources/YouTube.png" alt="YouTube Logo"></a>
                    </li>
                </ul>
            </div>
        </div>
        <center>Antra Warehouse 2025&copy;</center>
    </footer>
</body>

<!-- Dynamic link highlighting for nav -->
<script src="../script.js"></script>

<!-- Products loading script -->
<script src="../products.js"></script>

</html>
